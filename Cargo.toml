[workspace]
resolver = "2"
members = ["crates/core", "crates/claude", "crates/store", "crates/runtime", "apps/desktop"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/juliomatcom/xade"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
