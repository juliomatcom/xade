[workspace]
resolver = "2"
members = ["crates/core", "crates/claude", "crates/antigravity", "crates/codex", "crates/store", "crates/runtime", "apps/desktop"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/juliomatcom/xade"

# Keep debug builds small: file:line backtraces for our crates, none for deps.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
