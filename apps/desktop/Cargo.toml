[package]
name = "xade"
version = "0.4.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
xade-antigravity = { path = "../../crates/antigravity" }
xade-claude = { path = "../../crates/claude" }
xade-core = { path = "../../crates/core" }
xade-runtime = { path = "../../crates/runtime" }
xade-store = { path = "../../crates/store" }
dirs = "=7.0.0"
fontdb = "=0.24.0"
nucleo-matcher = "=0.3.1"
egui = { version = "=0.37.0", features = ["monochrome_emoji_fonts"] }
egui_commonmark = { version = "=0.26.0", features = ["better_syntax_highlighting"] }
egui_extras = { version = "=0.37.0", features = ["syntect"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
eframe = "=0.37.0"
pulldown-cmark = { version = "=0.13.6", default-features = false }
rfd = "=0.18.0"
serde_json = "=1.0.154"
similar = "=3.2.1"
time = { version = "=0.3.55", features = ["formatting"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
tracing = "=0.1.44"
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.29.3", features = ["v4"] }
ignore = "=0.4.35"
arboard = { version = "=3.7.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[lints]
workspace = true
