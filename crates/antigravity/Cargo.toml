[package]
name = "xade-antigravity"
version = "0.3.10"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
xade-core = { version = "0.3.0", path = "../core" }
libc = "=0.2.191"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", default-features = false, features = ["process", "io-util", "macros", "rt", "sync", "time"] }
tracing = "=0.1.44"

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
