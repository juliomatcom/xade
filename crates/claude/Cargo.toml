[package]
name = "xade-claude"
version = "0.3.7"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
xade-core = { version = "0.3.0", path = "../core" }
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
time = { version = "=0.3.55", features = ["parsing"] }
tokio = { version = "=1.54.1", default-features = false, features = ["process", "io-util", "macros", "rt", "sync", "time"] }
tracing = "=0.1.44"
uuid = { version = "=1.29.3", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
