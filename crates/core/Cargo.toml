[package]
name = "xade-core"
version = "0.4.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "=1.54.1", default-features = false, features = ["sync"] }
uuid = { version = "=1.29.3", features = ["v4", "serde"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "=1.0.154"
