[package]
name = "xade-runtime"
version = "0.3.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
xade-core = { path = "../core" }
xade-store = { path = "../store" }
time = "=0.3.55"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "process", "time", "sync", "macros"] }
tracing = "=0.1.44"
uuid = { version = "=1.29.3", features = ["v4"] }

[dev-dependencies]
xade-claude = { path = "../claude" }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
